services:
  dashboard:
    image: allanejones/isws-wq-dashboard:latest
    build: .
    container_name: isws-wq-dashboard
    ports:
      - "3000:3000"
    # Object store credentials for the /api/data proxy route. Read from a local
    # .env if present; otherwise set these in the deployment environment.
    environment:
      - S3_ENDPOINT
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_BUCKET
      - S3_PREFIX
      - S3_REGION
    command: npm run dev